<!doctype html><meta charset="utf-8"><title>小司天 · 动作预览</title><style>body{margin:32px;background:#101e26;color:#e8e1cf;font:16px system-ui}h1{font-size:25px}p{color:#b4c6cc}.grid{display:grid;grid-template-columns:repeat(auto-fit,220px);gap:16px}article{background:#22353d;border-radius:16px;padding:12px;text-align:center}h2{font-size:15px;font-weight:500}img{object-fit:contain}#gaze{width:192px;height:208px;background:url('../package/spritesheet.webp');background-size:800% 1100%;background-position:0% 90%}</style><h1>小司天 · 动作预览</h1><p>原生桌宠使用 192 × 208 动作格，实际显示会随桌宠大小缩放。移入注视卡片可查看方向变化。</p><div class="grid"><article><h2>待机与眨眼</h2><img src="idle.gif" alt="待机与眨眼" width="192" height="208"></article><article><h2>向右行走</h2><img src="running-right.gif" alt="向右行走" width="192" height="208"></article><article><h2>向左行走</h2><img src="running-left.gif" alt="向左行走" width="192" height="208"></article><article><h2>挥手</h2><img src="waving.gif" alt="挥手" width="192" height="208"></article><article><h2>跳跃</h2><img src="jumping.gif" alt="跳跃" width="192" height="208"></article><article><h2>疲倦与低落</h2><img src="failed.gif" alt="疲倦与低落" width="192" height="208"></article><article><h2>安静等待</h2><img src="waiting.gif" alt="安静等待" width="192" height="208"></article><article><h2>工作思考</h2><img src="running.gif" alt="工作思考" width="192" height="208"></article><article><h2>查看结果</h2><img src="review.gif" alt="查看结果" width="192" height="208"></article><article id="look"><h2>16向注视</h2><div id="gaze"></div></article></div><script>document.addEventListener('pointermove',e=>{const r=gaze.getBoundingClientRect(),dx=e.clientX-r.x-r.width/2,dy=e.clientY-r.y-r.height/2,i=Math.round(((Math.atan2(dx,-dy)*180/Math.PI+360)%360)/22.5)%16;gaze.style.backgroundPosition=(i%8)/7*100+'% '+(9+Math.floor(i/8))/10*100+'%'});</script>
